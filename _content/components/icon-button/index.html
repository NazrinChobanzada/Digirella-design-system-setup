<section><h2>Examples</h2>
<p>A circular, icon-only action. It always needs an accessible name.</p>
<div class="demo">
<button aria-label="Add to favourites" class="iconbtn" type="button">♥</button>
<button aria-label="Share" class="iconbtn iconbtn--outline" type="button">↗</button>
<button aria-label="Add" class="iconbtn iconbtn--solid" type="button">+</button>
<button aria-label="Delete" class="iconbtn iconbtn--outline" disabled="" type="button">✕</button>
</div>
</section>
