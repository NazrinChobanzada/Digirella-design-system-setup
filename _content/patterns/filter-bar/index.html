<section>
<h2>Filter bar</h2>
<p class="doc-lead">Tags for facets, Select for sorting. The selected tag fills with primary green; more than six facets collapse behind a “More filters” tag.</p>
<div class="box" style="padding:var(--space-5);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">
<span style="font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);background:var(--color-primary);color:var(--color-on-primary);border:1px solid var(--color-primary)">All</span>
<span style="font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default)">New</span>
<span style="font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default)">Used</span>
<span style="font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default)">Free shipping</span>
<span style="font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default);color:var(--text-secondary)">More filters</span>
<span style="margin-left:auto;display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-300);color:var(--text-secondary)">Sort
          <span style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px var(--space-4);background:var(--surface-card);color:var(--text-primary);display:inline-flex;gap:var(--space-5)">Best match <span style="color:var(--text-tertiary)">▾</span></span>
</span>
</div>
</section>
