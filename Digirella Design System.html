never a filled pill.<\u002Fp>\n      <div style=\"display:flex;gap:var(--space-7);border-bottom:1px solid var(--border-subtle);background:var(--surface-card);padding:0 var(--space-6);border-radius:var(--radius-md) var(--radius-md) 0 0\">\n        <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:600;box-shadow:inset 0 -2px 0 var(--color-primary);display:inline-flex;gap:var(--space-3)\">All <span style=\"color:var(--text-tertiary);font-size:var(--font-size-200)\">24<\u002Fspan><\u002Fspan>\n        <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Active<\u002Fspan>\n        <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary);display:inline-flex;gap:var(--space-3)\">Sold <span style=\"color:var(--text-tertiary);font-size:var(--font-size-200)\">8<\u002Fspan><\u002Fspan>\n        <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Drafts<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mx\" style=\"grid-template-columns:150px repeat(5,1fr)\">\n  <span><\u002Fspan><span class=\"ch\">Default<\u002Fspan><span class=\"ch\">Hover<\u002Fspan><span class=\"ch\">Active<\u002Fspan><span class=\"ch\">Focus<\u002Fspan><span class=\"ch\">Disabled<\u002Fspan>\n  <span class=\"rh\">Tabs<\u002Fspan><span class=\"cell\"><span style=\"display:inline-block;padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Listings<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-block;padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--border-default)\">Listings<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-block;padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:600;color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--color-primary)\">Listings<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-block;padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-primary);border-radius:var(--radius-xs);box-shadow:var(--focus-ring)\">Listings<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-block;padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-disabled)\">Listings<\u002Fspan><\u002Fspan>\n  <span class=\"rh\">SegmentedControl<\u002Fspan><span class=\"cell\"><span style=\"display:inline-flex;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\"><span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Grid<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-flex;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\"><span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:500;color:var(--text-primary);background:var(--alpha-black-04)\">Grid<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-flex;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\"><span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:600;background:var(--surface-card);box-shadow:var(--shadow-100)\">Grid<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-flex;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\"><span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:600;background:var(--surface-card);box-shadow:var(--focus-ring)\">Grid<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:inline-flex;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\"><span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:500;color:var(--text-disabled)\">Grid<\u002Fspan><\u002Fspan><\u002Fspan>\n  <span class=\"rh\">Pagination<\u002Fspan><span class=\"cell\"><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;color:var(--text-primary)\">5<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;color:var(--text-primary);background:var(--surface-hover)\">5<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:600;background:var(--color-primary);color:var(--color-on-primary);border:1px solid var(--color-primary)\">5<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;color:var(--text-primary);box-shadow:var(--focus-ring)\">5<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;color:var(--text-disabled)\">5<\u002Fspan><\u002Fspan>\n<\u002Fdiv><p class=\"lead\" style=\"margin:var(--space-5) 0 0\">Note hover versus active on Tabs: hover shows a <em>neutral<\u002Fem> underline, active a green one. Two greens would make the hovered tab compete with the real selection.<\u002Fp>\n      <div class=\"api\">items: { value, label, count? }[], value, onChange<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\"><a href=\"usage/tabs.html\"><b>Tabs — full usage guidance<\u002Fb><\u002Fa>: tabs versus segmented versus side navigation, counts, nesting, selection and URL, overflow, loading and empty panels, content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n\n    <section id=\"segmented\">\n      <h2>SegmentedControl<\u002Fh2>\n      <p class=\"lead\">Changes <em>how<\u002Fem> content is displayed — grid vs list, day vs week. It never changes <em>which<\u002Fem> content is shown; that is Tabs. Two to four options, short labels, one row.<\u002Fp>\n      <div class=\"spec\">\n        <span style=\"display:inline-flex;gap:2px;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\">\n          <span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:600;background:var(--surface-card);box-shadow:var(--shadow-100)\">Grid<\u002Fspan>\n          <span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">List<\u002Fspan>\n          <span style=\"padding:8px var(--space-5);border-radius:var(--radius-pill);font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Compact<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display:inline-flex;gap:2px;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-pill)\">\n          <span style=\"padding:6px var(--space-4);border-radius:var(--radius-pill);font-size:var(--font-size-200);font-weight:600;background:var(--surface-card);box-shadow:var(--shadow-100)\">Day<\u002Fspan>\n          <span style=\"padding:6px var(--space-4);border-radius:var(--radius-pill);font-size:var(--font-size-200);font-weight:500;color:var(--text-secondary)\">Week<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">medium · small<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"api\">items: { value, label }[], value, size: small | medium, onChange<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"pagination\">\n      <h2>Pagination<\u002Fh2>\n      <p class=\"lead\">First and last page always visible; the middle collapses to an ellipsis. Pair it with a result count above the list — a page number alone tells the user nothing about how much is left.<\u002Fp>\n      <div class=\"spec\" style=\"justify-content:space-between\">\n        <span style=\"font-size:var(--font-size-300);color:var(--text-secondary)\">Showing <b style=\"color:var(--text-primary)\">97–120<\u002Fb> of 486 results<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:var(--space-2)\">\n          <span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;border:1px solid var(--border-default);\">‹<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;\">1<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;color:var(--text-tertiary);\">…<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;\">4<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:600;background:var(--color-primary);color:var(--color-on-primary);border:1px solid var(--color-primary);\">5<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;\">6<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;color:var(--text-tertiary);\">…<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;\">21<\u002Fspan><span style=\"min-width:34px;height:34px;padding:0 var(--space-3);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--font-size-300);font-weight:500;border:1px solid var(--border-default);\">›<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:var(--space-5)\">\n        <div class=\"rule\"><b>Do<\u002Fb><span>Use pagination for tables and search results — a stable URL per page matters for sharing and back-navigation.<\u002Fspan><\u002Fdiv>\n        <div class=\"rule\"><b>Don't<\u002Fb><span>Use infinite scroll anywhere a footer or a total count is needed.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">page, pageCount, siblings (default 1), onChange<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"breadcrumb\">\n      <h2>Breadcrumb<\u002Fh2>\n      <p class=\"lead\">Category depth, maximum four levels, the last item being the current page. It describes hierarchy — not history — so it never replaces a back ustify-content:center;font-size:var(--font-size-200);font-weight:600\">2<\u002Fspan><span style=\"font-size:var(--font-size-300);font-weight:600\">Delivery<\u002Fspan><\u002Fli>\n          <span style=\"flex:1;height:1px;background:var(--border-default)\"><\u002Fspan>\n          <li style=\"display:flex;align-items:center;gap:var(--space-3)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--surface-sunken);color:var(--text-tertiary);display:inline-flex;align-items:center;justify-content:center;font-size:var(--font-size-200);font-weight:600\">3<\u002Fspan><span style=\"font-size:var(--font-size-300);font-weight:500;color:var(--text-tertiary)\">Payment<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div class=\"api\">items: { label }[], current (zero-based)<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"table\">\n      <h2>Table<\u002Fh2>\n      <p class=\"lead\">CSS-grid table with hairline row dividers, never stripes. Columns declared as grid tracks; setting <code>align: 'right'<\u002Fcode> on a column also switches it to tabular figures so digits stay in vertical register.<\u002Fp>\n      <div class=\"box\" style=\"overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:40px 2.2fr 1fr 1fr 1fr;gap:var(--space-5);padding:var(--space-4) var(--space-6);background:var(--surface-sunken);font-size:var(--font-size-100);font-weight:600;letter-spacing:var(--letter-spacing-wide);text-transform:uppercase;color:var(--text-tertiary)\">\n          <span><\u002Fspan><span>Listing<\u002Fspan><span>Status<\u002Fspan><span style=\"text-align:right\">Price<\u002Fspan><span style=\"text-align:right\">Views<\u002Fspan>\n        <\u002Fdiv>\n        \n        <div style=\"display:grid;grid-template-columns:40px 2.2fr 1fr 1fr 1fr;gap:var(--space-5);align-items:center;padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle);\">\n          <span style=\"width:16px;height:16px;border-radius:var(--rad <span style=\"width:16px;height:16px;border-radius:var(--radius-xs);border:1px solid var(--border-strong);background:var(--surface-card);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center\"><\u002Fspan>\n          <span style=\"font-size:var(--font-size-300)\">35mm film camera<\u002Fspan>\n          <span><span class=\"badge\" style=\"background:var(--surface-sunken);color:var(--text-secondary)\">Sold<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:var(--font-size-300);font-weight:600;text-align:right;font-variant-numeric:tabular-nums\">4 200 ₺<\u002Fspan>\n          <span style=\"font-size:var(--font-size-300);color:var(--text-secondary);text-align:right;font-variant-numeric:tabular-nums\">—<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mx\" style=\"grid-template-columns:150px repeat(5,1fr)\">\n  <span><\u002Fspan><span class=\"ch\">Default<\u002Fspan><span class=\"ch\">Hover<\u002Fspan><span class=\"ch\">Selected<\u002Fspan><span class=\"ch\">Focus<\u002Fspan><span class=\"ch\">Disabled<\u002Fspan>\n  <span class=\"rh\">Table row<\u002Fspan><span class=\"cell\"><span style=\"display:grid;grid-template-columns:1fr auto;gap:var(--space-4);align-items:center;padding:var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);\"><span>Film camera<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:600\">4 200 ₺<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:grid;grid-template-columns:1fr auto;gap:var(--space-4);align-items:center;padding:var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);background:var(--surface-hover)\"><span>Film camera<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:600\">4 200 ₺<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:grid;grid-template-columns:1fr auto;gap:var(--space-4);align-items:center;padding:var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);background:var(--surface-brand-subtle)\"><span>Film camera<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:600\">4 200 ₺<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:grid;grid-template-columns:1fr auto;gap:var(--space-4);align-items:center;padding:var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);box-shadow:var(--focus-ring)\"><span>Film camera<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:600\">4 200 ₺<\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:grid;grid-template-columns:1fr auto;gap:var(--space-4);align-items:center;padding:var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-disabled)\"><span>Film camera<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;font-weight:600\">4 200 ₺<\u002Fspan><\u002Fspan><\u002Fspan>\n  <span class=\"rh\">Menu item<\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary)\">Edit listing<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary);background:var(--surface-hover)\">Edit listing<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary);background:var(--surface-brand-subtle)\">Edit listing<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary);box-shadow:var(--focus-ring)\">Edit listing<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-disabled)\">Edit listing<\u002Fspan><\u002Fspan>\n  <span class=\"rh\">Combobox option<\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary)\">Headphones<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary);background:var(--surface-hover)\">Headphones<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary);background:var(--surface-hover);font-weight:600\">Headphones ✓<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-primary);box-shadow:var(--focus-ring)\">Headphones<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"display:block;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-disabled)\">Headphones<\u002Fspan><\u002Fspan>\n<\u002Fdiv><p class=\"lead\" style=\"margin:var(--space-5) 0 0\">Selection in a list is a tint, never a fill. The content stays readable and the row keeps its own hover on top of the selection.<\u002Fp>\n      <div class=\"api\">columns: { key, header, width?, align?, render? }[], rows, density: comfortable | compact, selectable, selected, onSelect, empty<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\"><a href=\"usage/table.html\"><b>Table — full usage guidance<\u002Fb><\u002Fa>: table versus list versus cards, column alignment rules, density, selection and bulk actions, expandable rows, sorting states, pagination, loading/empty/error, small-screen strategies, content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"avatar\">\n      <h2>Avatar &amp; Rating<\u002Fh2>\n      <p class=\"lead\">Avatar falls back to initials on the brand tint — never a random colour per user, which reads as decoration rather than identity. Rating stars are brand green, because the system has exactly one accent.<\u002Fp>\n      <div class=\"spec\" style=\"gap:var(--space-9)\">\n        <span style=\"display:flex;align-items:center;gap:var(--space-4)\">\n          <span style=\"width:28px;height:28px;border-radius:50%;background:var(--surface-brand-subtle);border:1px solid var(--color-primary-border);color:var(--text-brand);font-weight:600;font-size:11px;display:inline-flex;align-items:center;justify-content:center\">DA<\u002Fspan>\n          <span style=\"position:relative;display:inline-flex\"><span style=\"width:36px;height:36px;border-radius:50%;background:var(--surface-brand-subtle);border:1px solid var(--color-primary-border);color:var(--text-brand);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center\">SE<\u002Fspan><span style=\"position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--status-success);border:2px solid var(--surface-card)\"><\u002Fspan><\u002Fspan>\n          <span style=\"width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface-brand-subtle);border:1px solid var(--color-primary-border);color:var(--text-brand);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center\">MK<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:var(--space-2)\">\n          <span style=\"color:var(--color-primary);font-size:16px;letter-spacing:1px\">★★★★<\u002Fspan><span style=\"color:var(--neutral-30);font-size:16px\">★<\u002Fspan>\n          <span style=\"font-size:var(--font-size-200);font-weight:600\">4.7<\u002Fspan><span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">(128)<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"api\">Avatar — name, src, size, shape, badge &nbsp;·&nbsp; Rating — value, count, size, showValue<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"progress\">\n      <h2>ProgressBar &amp; Skeleton<\u002Fh2>\n      <p class=\"lead\">ProgressBar only for progress you can measure. Skeleton for unknown duration — mirroring the real layout, same line count and image ratio. Never a full-page spinner.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)\">\n        <div class=\"box\" style=\"padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)\">\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:var(--font-size-200);margin-bottom:var(--space-2)\"><span style=\"color:var(--text-secondary)\">Listing completeness<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--text-tertiary)\">70%<\u002Fspan><\u002Fdiv>\n            <div style=\"height:6px;border-radius:var(--radius-pill);background:var(--neutral-10);overflow:hidden\"><div style=\"width:70%;height:100%;background:var(--color-primary);border-radius:var(--radius-pill)\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:var(--font-size-200);margin-bottom:var(--space-2)\"><span style=\"color:var(--text-secondary)\">Storage used<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--text-tertiary)\">92%<\u002Fspan><\u002Fdiv>\n            <div style=\"height:6px;border-radius:var(--radius-pill);background:var(--neutral-10);overflow:hidden\"><div style=\"width:92%;height:100%;background:var(--status-warning);border-radius:var(--radius-pill)\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6);display:flex;gap:var(--space-5)\">\n          <div style=\"width:88px;height:88px;border-radius:var(--radius-sm);background:var(--neutral-10);flex:0 0 88px\"><\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-2)\">\n            <div style=\"height:12px;width:90%;border-radius:var(--radius-xs);background:var(--neutral-10)\"><\u002Fdiv>\n            <div style=\"height:12px;width:60%;border-radius:var(--radius-xs);background:var(--neutral-10)\"><\u002Fdiv>\n            <div style=\"height:12px;width:40%;border-radius:var(--radius-xs);background:var(--neutral-05)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">ProgressBar — value, max, label, tone, showValue &nbsp;·&nbsp; Skeleton — width, height, shape: line | block | circle<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"accordion\">\n      <h2>Accordion<\u002Fh2>\n      <p class=\"lead\">Disclosure list, one panel open at a time. Product specs, shipping terms, FAQs — never information required to finish the current task.<\u002Fp>\n      <div class=\"box\" style=\"overflow:hidden;max-width:560px\">\n        <div style=\"padding:var(--space-5) var(--space-6)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:var(--font-size-300);font-weight:600\">Shipping &amp; returns <span style=\"color:var(--text-secondary);transform:rotate(180deg);line-height:1\">▾<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:var(--font-size-300);color:var(--text-secondary);line-height:1.5;margin-top:var(--space-4)\">Dispatched same day. Free returns within 14 days, with the seller covering return shipping.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--border-subtle);padding:var(--space-5) var(--space-6);display:flex;justify-content:space-between;align-items:center;font-size:var(--font-size-300);font-weight:600\">Specifications <span style=\"color:var(--text-secondary);line-height:1\">▾<\u002Fspan><\u002Fdiv>\n        <div style=\"border-top:1px solid var(--border-subtle);padding:var(--space-5) var(--space-6);display:flex;justify-content:space-between;align-items:center;font-size:var(--font-size-300);font-weight:600\">Seller policies <span style=\"color:var(--text-secondary);line-height:1\">▾<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">items: { title, content }[], openIndex, onToggle<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\"><a href=\"usage/accordion.html\"><b>Accordion — full usage guidance<\u002Fb><\u002Fa>: when hiding content is worth it, single versus multiple open, headers with metadata, motion, default state, deep linking and find-in-page, content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"dialog\">\n      <h2>Dialog<\u002Fh2>\n      <p class=\"lead\">Confirmations and short focused tasks. Actions sit bottom-right, primary furthest right. Never nest a dialog inside a dialog.<\u002Fp>\n      <div style=\"background:var(--neutral-10);border-radius:var(--radius-md);padding:var(--space-9);display:flex;justify-content:center\">\n        <div style=\"width:100%;max-width:440px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-400);padding:var(--space-8)\">\n          <div style=\"font-size:var(--type-heading-size);font-weight:600\">Cancel this order?<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-300);color:var(--text-secondary);margin-top:var(--space-3);line-height:1.5\">This can't be undone. Your refund arrives in 3–5 business days.<\u002Fdiv>\n          <div style=\"display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-8)\">\n            <span class=\"btn\" style=\"color:var(--text-primary)\">Keep order<\u002Fspan>\n            <span class=\"btn\" style=\"background:var(--status-danger);color:#fff\">Cancel order<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">open, title, subtitle, description, footer, onClose, onRequestClose, dividedFooter, showClose, initialFocusRef, width (default 480)<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\"><a href=\"usage/modal.html\"><b>Modal — full usage guidance<\u002Fb><\u002Fa>: choosing between toast, popover, drawer, dialog and page; confirmation, destructive and form dialogs; focus management, submitting and errors, mobile, stacking, content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n\n    <section id=\"drawer\">\n      <h2>Drawer<\u002Fh2>\n      <p class=\"lead\">Edge-anchored panel for work that keeps page context: filters, mini cart, listing preview. Use a Dialog instead when the task must be finished or abandoned. <code>side=\"bottom\"<\u002Fcode> is the mobile default. The commit action lives in a sticky footer, so a long filter list never buries it.<\u002Fp>\n      <div style=\"background:var(--neutral-10);border-radius:var(--radius-md);padding:var(--space-6);display:flex;justify-content:flex-end;min-height:340px\">\n        <div style=\"width:380px;background:var(--surface-card);border-radius:var(--radius-lg) 0 0 var(--radius-lg);box-shadow:var(--shadow-400);display:flex;flex-direction:column\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;padding:var(--space-6) var(--space-7);border-bottom:1px solid var(--border-subtle)\">\n            <div><div style=\"font-size:var(--type-heading-size);font-weight:600\">Filters<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">486 results<\u002Fdiv><\u002Fdiv>\n            <span style=\"width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:18px\">×<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-6)\">\n            <div>\n              <div style=\"font-size:var(--font-size-300);font-weight:600;margin-bottom:var(--space-4)\">Condition<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n                <label style=\"display:flex;gap:var(--space-4);align-items:center;font-size:var(--font-size-300)\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan>New<\u002Flabel>\n                <label style=\"display:flex;gap:var(--space-4);align-items:center;font-size:var(--font-size-300);color:var(--text-secondary)\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-strong)\"><\u002Fspan>Refurbished<\u002Flabel>\n                <label style=\"display:flex;gap:var(--space-4);align-items:center;font-size:var(--font-size-300);color:var(--text-secondary)\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-strong)\"><\u002Fspan>Used<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-3)\"><span style=\"font-size:var(--font-size-300);font-weight:600\">Max price<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:var(--font-size-200);color:var(--text-secondary)\">6 500 ₺<\u002Fspan><\u002Fdiv>\n              <div style=\"position:relative;height:20px;display:flex;align-items:center\">\n                <div style=\"position:absolute;left:0;right:0;height:4px;border-radius:var(--radius-pill);background:var(--neutral-20)\"><\u002Fdiv>\n                <div style=\"position:absolute;left:0;width:65%;height:4px;border-radius:var(--radius-pill);background:var(--color-primary)\"><\u002Fdiv>\n                <div style=\"position:absolute;left:calc(65% - 9px);width:18px;height:18px;border-radius:50%;background:var(--surface-card);border:2px solid var(--color-primary);box-shadow:var(--shadow-100)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:var(--space-3);justify-content:flex-end;padding:var(--space-6) var(--space-7);border-top:1px solid var(--border-subtle)\">\n            <span class=\"btn\" style=\"color:var(--text-primary)\">Clear all<\u002Fspan>\n            <span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary)\">Show 128 results<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">open, side: left | right | bottom, width (default 420), title, description, footer, onClose &nbsp;·&nbsp; Esc closes<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\"><a href=\"usage/overlays.html\"><b>Overlays — full usage guidance<\u002Fb><\u002Fa>: choosing between tooltip, toast, alert, popover, menu, drawer and dialog; the layer scale; dismissal and positioning rules; focus behaviour per overlay; mobile equivalents; content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"menu\">\n      <h2>Menu &amp; Popover<\u002Fh2>\n      <p class=\"lead\">Menu is a list of actions attached to a trigger; destructive entries carry <code>tone: 'danger'<\u002Fcode> and sit last, below a divider. Popover holds rich anchored content instead — a shipping breakdown, a mini seller profile. One line of text is a Tooltip, not either of these.<\u002Fp>\n      <div style=\"display:flex;gap:var(--space-7);align-items:flex-start;flex-wrap:wrap\">\n        <div class=\"box\" style=\"padding:var(--space-2);width:230px;box-shadow:var(--shadow-300);border-color:var(--border-subtle);border-radius:var(--radius-sm)\">\n          <div style=\"padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);display:flex;justify-content:space-between\">Edit listing<span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);color:var(--text-tertiary)\">E<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);background:var(--surface-hover);display:flex;justify-content:space-between\">Duplicate<span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);color:var(--text-tertiary)\">D<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-disabled)\">End listing early<\u002Fdiv>\n          <div style=\"height:1px;background:var(--border-subtle);margin:var(--space-2) 0\"><\u002Fdiv>\n          <div style=\"padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);color:var(--text-danger)\">Delete<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6);width:280px;box-shadow:var(--shadow-300)\">\n          <div style=\"font-size:var(--font-size-300);font-weight:600;margin-bottom:var(--space-4)\">Shipping breakdown<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--font-size-200)\">\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--text-secondary)\">Standard · 2–4 days<\u002Fspan><span style=\"color:var(--text-success);font-weight:600\">Free<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--text-secondary)\">Express · next day<\u002Fspan><span>49 ₺<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--text-secondary)\">Locker pickup<\u002Fspan><span>19 ₺<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">Menu — items: { value, label, icon?, shortcut?, tone?, disabled?, divider? }[], align, onSelect &nbsp;·&nbsp; Popover — trigger, placement, width<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"alert\">\n      <h2>Alert<\u002Fh2>\n      <p class=\"lead\">Persistent, page-level banner that stays until the condition changes. Toast is transient; a field <code>error<\u002Fcode> belongs to one input. Each says what happened and what to do next.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4);max-width:640px\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-brand-subtle);border:1px solid var(--color-primary-border);border-radius:var(--radius-sm);padding:var(--space-5)\">\n          <span style=\"color:var(--color-primary);font-weight:700\">✓<\u002Fspan>\n          <div style=\"flex:1\"><div style=\"font-size:var(--font-size-300);font-weight:600;color:#000000\">Listing published<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">It appears in search within a minute.<\u002Fdiv><\u002Fdiv>\n          <span style=\"color:var(--text-tertiary)\">×<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-warning-subtle);border:1px solid var(--amber-30);border-radius:var(--radius-sm);padding:var(--space-5)\">\n          <span style=\"color:var(--status-warning);font-weight:700\">!<\u002Fspan>\n          <div style=\"flex:1\"><div style=\"font-size:var(--font-size-300);font-weight:600;color:#000000\">Verify your payout account<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">Payouts are held until the account is confirmed.<\u002Fdiv>\n          <div style=\"margin-top:var(--space-4)\"><span class=\"btn\" style=\"background:var(--surface-card);border-color:var(--border-strong);color:var(--text-primary);padding:6px 14px;font-size:var(--font-size-200)\">Verify account<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">tone: success | info | warning | danger &nbsp;·&nbsp; title, action, onDismiss<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"toast\">\n      <h2>Toast<\u002Fh2>\n      <p class=\"lead\">Transient confirmation, bottom-right, 4–6 seconds. A 3px left bar carries the tone colour. Errors that block a task belong in the page, not a toast.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);max-width:760px\">\n        <div style=\"display:flex;gap:var(--space-4);background:var(--surface-brand-subtle);border-left:3px solid var(--color-primary);border-radius:var(--radius-sm);padding:var(--space-5);box-shadow:var(--shadow-300)\">\n          <div style=\"flex:1\"><div style=\"font-size:var(--font-size-300);font-weight:600;color:var(--text-success)\">Added to cart<\u002Fdiv><div style=\"font-size:var(--font-size-300);color:var(--text-secondary)\">2 items<\u002Fdiv><\u002Fdiv>\n          <span style=\"color:var(--text-tertiary)\">×<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-4);background:var(--surface-danger-subtle);border-left:3px solid var(--status-danger);border-radius:var(--radius-sm);padding:var(--space-5);box-shadow:var(--shadow-300)\">\n          <div style=\"flex:1\"><div style=\"font-size:var(--font-size-300);font-weight:600;color:var(--text-danger)\">Payment declined<\u002Fdiv><div style=\"font-size:var(--font-size-300);color:var(--text-secondary)\">Check your card details<\u002Fdiv><\u002Fdiv>\n          <span style=\"color:var(--text-tertiary)\">×<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">tone: success | info | warning | danger &nbsp;·&nbsp; title, message, action, onDismiss<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"tooltip\">\n      <h2>Tooltip<\u002Fh2>\n      <p class=\"lead\">One line, on hover and focus. Never holds information required to complete the task.<\u002Fp>\n      <div class=\"spec\" style=\"justify-content:center;padding:var(--space-9)\">\n        <span style=\"background:var(--surface-inverse);color:var(--text-inverse);font-size:var(--font-size-200);padding:6px 10px;border-radius:var(--radius-xs);box-shadow:var(--shadow-300)\">Free returns within 14 days<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"api\">content, placement: top | bottom | left | right<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ PATTERNS ============ -->\n    <section id=\"p-pageheader\">\n      <div class=\"cap\">Patterns<\u002Fdiv>\n      <h2>Page header<\u002Fh2>\n      <p class=\"lead\">Title left, single primary action right, tabs directly underneath when the page has views. No breadcrumb above the fold — a back link is used instead.<\u002Fp>\n      <div class=\"box\" style=\"padding:var(--space-7)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:var(--space-6)\">\n          <div>\n            <div style=\"font-size:var(--type-title-size);font-weight:600\">Seller dashboard<\u002Fdiv>\n            <div style=\"font-size:var(--font-size-300);color:var(--text-secondary);margin-top:var(--space-2)\">24 active listings · 3 orders awaiting dispatch<\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary)\">＋ Create listing<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-7);border-bottom:1px solid var(--border-subtle);margin-top:var(--space-6)\">\n          <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:600;box-shadow:inset 0 -2px 0 var(--color-primary)\">Overview<\u002Fspan>\n          <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Listings<\u002Fspan>\n          <span style=\"padding:var(--space-4) 0;font-size:var(--font-size-300);font-weight:500;color:var(--text-secondary)\">Orders<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-product\">\n      <h2>Product card grid<\u002Fh2>\n      <p class=\"lead\">Square image flush to the card edge, then badges, title, price, shipping — always that order. Three columns at 1280px, two at 900px, one below 600px. Shadow appears on hover only.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6)\">\n        \n        <div class=\"box\" style=\"overflow:hidden;box-shadow:var(--shadow-300);border-color:var(--border-default)\">\n          <div class=\"ph\" style=\"height:150px\">product image<\u002Fdiv>\n          <div style=\"padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)\">\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <span class=\"badge\" style=\"background:var(--surface-brand-subtle);color:var(--text-success)\">New<\u002Fspan>\n              <span class=\"badge\" style=\"background:var(--surface-warning-subtle);color:var(--text-warning)\">Deal<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:var(--font-size-300);line-height:1.4\">Wireless headphones · ANC<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-3)\">\n              <span style=\"font-size:var(--font-size-500);font-weight:700\">2 480 ₺<\u002Fspan>\n              <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-decoration:line-through\">3 100 ₺<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:var(--font-size-200);color:var(--text-success)\">Free shipping<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"overflow:hidden;\">\n          <div class=\"ph\" style=\"height:150px\">product image<\u002Fdiv>\n          <div style=\"padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)\">\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <span class=\"badge\" style=\"background:var(--surface-sunken);color:var(--text-secondary)\">Used<\u002Fspan>\n              \n            <\u002Fdiv>\n            <div style=\"font-size:var(--font-size-300);line-height:1.4\">Mechanical keyboard 75%<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-3)\">\n              <span style=\"font-size:var(--font-size-500);font-weight:700\">1 850 ₺<\u002Fspan>\n              \n            <\u002Fdiv>\n            <div style=\"font-size:var(--font-size-200);color:var(--text-success)\">Free shipping<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"overflow:hidden;\">\n          <div class=\"ph\" style=\"height:150px\">product image<\u002Fdiv>\n          <div style=\"padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)\">\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <span class=\"badge\" style=\"background:var(--surface-sunken);color:var(--text-secondary)\">Refurbished<\u002Fspan>\n              <span class=\"badge\" style=\"background:var(--surface-warning-subtle);color:var(--text-warning)\">Deal<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:var(--font-size-300);line-height:1.4\">35mm film camera<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:var(--space-3)\">\n              <span style=\"font-size:var(--font-size-500);font-weight:700\">4 200 ₺<\u002Fspan>\n              <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-decoration:line-through\">4 900 ₺<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">49 ₺ shipping<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:var(--space-5)\">\n        <div class=\"rule\"><b>Hover<\u002Fb><span>Card 1 shows the hover state: <code>--shadow-300<\u002Fcode> over 220ms. The image never scales.<\u002Fspan><\u002Fdiv>\n        <div class=\"rule\"><b>Free shipping<\u002Fb><span>Rendered in <code>--text-success<\u002Fcode> — the only place green text appears in a card.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-filter\">\n      <h2>Filter bar<\u002Fh2>\n      <p class=\"lead\">Tags for facets, Select for sorting. The selected tag fills with primary green; more than six facets collapse behind a “More filters” tag.<\u002Fp>\n      <div class=\"box\" style=\"padding:var(--space-5);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap\">\n        <span style=\"font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);background:var(--color-primary);color:var(--color-on-primary);border:1px solid var(--color-primary)\">All<\u002Fspan>\n        <span style=\"font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default)\">New<\u002Fspan>\n        <span style=\"font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default)\">Used<\u002Fspan>\n        <span style=\"font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default)\">Free shipping<\u002Fspan>\n        <span style=\"font-size:var(--font-size-300);font-weight:500;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-default);color:var(--text-secondary)\">More filters<\u002Fspan>\n        <span style=\"margin-left:auto;display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-300);color:var(--text-secondary)\">Sort\n          <span style=\"border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px var(--space-4);background:var(--surface-card);color:var(--text-primary);display:inline-flex;gap:var(--space-5)\">Best match <span style=\"color:var(--text-tertiary)\">▾<\u002Fspan><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-form\">\n      <h2>Form layout<\u002Fh2>\n      <p class=\"lead\">One column, 12px between fields, 32px between groups. Group headings are 19px/600. The submit button is left-aligned with the fields, never centred. <a href=\"usage/form-layout.html\"><b>Form layout — full usage guidance<\u002Fb><\u002Fa>: column rules, field pairs, grouping, widths and spacing, validation timing, error summaries, required versus optional, submitting, dependent fields, long forms and steps.<\u002Fp>\n      <div class=\"box\" style=\"padding:var(--space-8);max-width:520px\">\n        <div style=\"font-size:var(--type-heading-size);font-weight:600\">Delivery address<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-4);margin-top:var(--space-5)\">\n          <div><div style=\"font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)\">Full name<\u002Fdiv><div style=\"border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:11px var(--space-4);font-size:var(--font-size-400)\">Deniz Aydın<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)\">Street<\u002Fdiv><div style=\"border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:11px var(--space-4);font-size:var(--font-size-400)\">Bağdat Cad. 128/4<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)\">\n            <div><div style=\"font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)\">Postcode<\u002Fdiv><div style=\"border:1px solid var(--border-danger);border-radius:var(--radius-sm);padding:11px var(--space-4);font-size:var(--font-size-400)\">1234<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-danger);margin-top:var(--space-2)\">Enter a valid postcode<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)\">City<\u002Fdiv><div style=\"border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:11px var(--space-4);font-size:var(--font-size-400);display:flex;justify-content:space-between\">İstanbul <span style=\"color:var(--text-tertiary)\">▾<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:1px;background:var(--border-subtle);margin:var(--space-8) 0\"><\u002Fdiv>\n        <label style=\"display:flex;gap:var(--space-4);align-items:flex-start;font-size:var(--font-size-300)\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan>Save this address for next time<\u002Flabel>\n        <div style=\"display:flex;gap:var(--space-3);margin-top:var(--space-8)\">\n          <span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary)\">Save address<\u002Fspan>\n          <span class=\"btn\" style=\"color:var(--text-primary)\">Cancel<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-summary\">\n      <h2>Order summary<\u002Fh2>\n      <p class=\"lead\">A raised card, sticky beside the item list. Totals in 19px/700; free shipping is the only line rendered in green. The reassurance line sits under the button, 12px, tertiary.<\u002Fp>\n      <div class=\"box\" style=\"padding:var(--space-6);box-shadow:var(--shadow-200);max-width:340px;display:flex;flex-direction:column;gap:var(--space-4)\">\n        <div style=\"font-size:var(--type-heading-size);font-weight:600\">Summary<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:var(--font-size-300);color:var(--text-secondary)\"><span>Subtotal<\u002Fspan><span>4 330 ₺<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:var(--font-size-300);color:var(--text-secondary)\"><span>Shipping<\u002Fspan><span style=\"color:var(--text-success)\">Free<\u002Fspan><\u002Fdiv>\n        <div style=\"height:1px;background:var(--border-subtle)\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:var(--font-size-500);font-weight:700\"><span>Total<\u002Fspan><span>4 330 ₺<\u002Fspan><\u002Fdiv>\n        <span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary);padding:14px 28px;font-size:var(--font-size-400);margin-top:var(--space-3)\">Go to checkout<\u002Fspan>\n        <div style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-align:center\">Buyer protection included<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-table\">\n      <h2>Data table<\u002Fh2>\n      <p class=\"lead\">Rows are 1px-divided, never striped. Status uses Badge, numbers are right-aligned and tabular. Row height 69px with a thumbnail, 52px without.<\u002Fp>\n      <div class=\"box\" style=\"overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:var(--space-5);padding:var(--space-4) var(--space-6);background:var(--surface-sunken);font-size:var(--font-size-100);font-weight:600;letter-spacing:var(--letter-spacing-wide);text-transform:uppercase;color:var(--text-tertiary)\">\n          <span>Listing<\u002Fspan><span>Status<\u002Fspan><span style=\"text-align:right\">Price<\u002Fspan><span style=\"text-align:right\">Views<\u002Fspan>\n        <\u002Fdiv>\n        \n        <div style=\"display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:var(--space-5);align-items:center;padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle);\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-4)\"><span class=\"ph\" style=\"width:44px;height:44px;border-radius:var(--radius-sm);flex:0 0 44px\"><\u002Fspan><span style=\"font-size:var(--font-size-300)\">Wireless headphones · ANC<\u002Fspan><\u002Fdiv>\n          <div><span class=\"badge\" style=\"background:var(--surface-brand-subtle);color:var(--text-success)\">Active<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:var(--font-size-300);font-weight:600;text-align:right;font-variant-numeric:tabular-nums\">2 480 ₺<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-align:right;font-variant-numeric:tabular-nums\">128<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:var(--space-5);align-items:center;padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle);background:var(--surface-hover);\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-4)\"><span class=\"ph\" style=\"width:44px;height:44px;border-radius:var(--radius-sm);flex:0 0 44px\"><\u002Fspan><span style=\"font-size:var(--font-size-300)\">Mechanical keyboard 75%<\u002Fspan><\u002Fdiv>\n          <div><span class=\"badge\" style=\"background:var(--surface-brand-subtle);color:var(--text-success)\">Active<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:var(--font-size-300);font-weight:600;text-align:right;font-variant-numeric:tabular-nums\">1 850 ₺<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-align:right;font-variant-numeric:tabular-nums\">64<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:var(--space-5);align-items:center;padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle);\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-4)\"><span class=\"ph\" style=\"width:44px;height:44px;border-radius:var(--radius-sm);flex:0 0 44px\"><\u002Fspan><span style=\"font-size:var(--font-size-300)\">35mm film camera<\u002Fspan><\u002Fdiv>\n          <div><span class=\"badge\" style=\"background:var(--surface-sunken);color:var(--text-secondary)\">Sold<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:var(--font-size-300);font-weight:600;text-align:right;font-variant-numeric:tabular-nums\">4 200 ₺<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-align:right;font-variant-numeric:tabular-nums\">—<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:var(--space-5);align-items:center;padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle);\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-4)\"><span class=\"ph\" style=\"width:44px;height:44px;border-radius:var(--radius-sm);flex:0 0 44px\"><\u002Fspan><span style=\"font-size:var(--font-size-300)\">Leather backpack · 18L<\u002Fspan><\u002Fdiv>\n          <div><span class=\"badge\" style=\"background:var(--surface-warning-subtle);color:var(--text-warning)\">Draft<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:var(--font-size-300);font-weight:600;text-align:right;font-variant-numeric:tabular-nums\">1 190 ₺<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-tertiary);text-align:right;font-variant-numeric:tabular-nums\">—<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rule\" style=\"margin-top:var(--space-5)\"><b>Hover<\u002Fb><span>Row 2 shows the hover state: <code>--surface-hover<\u002Fcode>, no shadow, no border change.<\u002Fspan><\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-empty\">\n      <h2>Empty state<\u002Fh2>\n      <p class=\"lead\">Centred, 96px of vertical space, one sentence of explanation and one action. No illustration — the system has none, and a placeholder graphic reads worse than white space.<\u002Fp>\n      <div class=\"box\" style=\"padding:var(--space-13) var(--space-8);text-align:center\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--surface-brand-subtle);display:inline-flex;align-items:center;justify-content:center;color:var(--color-primary);font-size:22px;margin-bottom:var(--space-5)\">＋<\u002Fdiv>\n        <div style=\"font-size:var(--type-heading-size);font-weight:600\">No listings yet<\u002Fdiv>\n        <div style=\"font-size:var(--font-size-300);color:var(--text-secondary);margin-top:var(--space-3);max-width:380px;margin-inline:auto;line-height:1.5\">Create your first listing and it appears here within a minute.<\u002Fdiv>\n        <div style=\"margin-top:var(--space-6)\"><span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary)\">Create listing<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"p-messaging\" style=\"padding-bottom:var(--space-13)\">\n      <h2>Status messaging<\u002Fh2>\n      <p class=\"lead\">Three levels. Inline banner for page-level context, toast for transient confirmation, field error for a specific input. Each says what happened and what to do next; never “Error!”.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-4);max-width:640px\">\n        <div style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-brand-subtle);border:1px solid var(--color-primary-border);border-radius:var(--radius-sm);padding:var(--space-5)\">\n          <span style=\"color:var(--color-primary);font-weight:700\">✓<\u002Fspan>\n          <div><div style=\"font-size:var(--font-size-300);font-weight:600;color:#000000\">Buyer protection<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">Get your money back if the item doesn't match the description.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-info-subtle);border:1px solid var(--blue-30);border-radius:var(--radius-sm);padding:var(--space-5)\">\n          <span style=\"color:var(--status-info);font-weight:700\">i<\u002Fspan>\n          <div><div style=\"font-size:var(--font-size-300);font-weight:600;color:#000000\">Dispatch is slower this week<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">Orders placed today ship within three business days.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-warning-subtle);border:1px solid var(--amber-30);border-radius:var(--radius-sm);padding:var(--space-5)\">\n          <span style=\"color:var(--status-warning);font-weight:700\">!<\u002Fspan>\n          <div><div style=\"font-size:var(--font-size-300);font-weight:600;color:#000000\">Only 3 left in stock<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">Other buyers are viewing this item right now.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-4);align-items:flex-start;background:var(--surface-danger-subtle);border:1px solid var(--red-30);border-radius:var(--radius-sm);padding:var(--space-5)\">\n          <span style=\"color:var(--status-danger);font-weight:700\">×<\u002Fspan>\n          <div><div style=\"font-size:var(--font-size-300);font-weight:600;color:#000000\">We couldn't take payment<\u002Fdiv><div style=\"font-size:var(--font-size-200);color:var(--text-secondary);margin-top:2px\">Check your card details or choose another payment method.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:var(--space-6)\">\n        <div class=\"rule\"><b>Tone<\u002Fb><span>Second person, sentence case, no exclamation marks, no emoji.<\u002Fspan><\u002Fdiv>\n        <div class=\"rule\"><b>Numbers<\u002Fb><span>Locale-formatted with the currency last: <code>2 480 ₺<\u002Fcode>, <code>99.2%<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
