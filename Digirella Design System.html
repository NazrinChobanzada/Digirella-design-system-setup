  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 justify-content: center; gap: var(--space-3); font-family: var(--font-sans); font-weight: 600; line-height: 1; border-radius: var(--radius-control); border: 1px solid transparent; padding: 10px 20px; font-size: var(--font-size-300); }\n  .badge { font-size: var(--font-size-200); font-weight: 600; line-height: 1; padding: 5px 10px; border-radius: var(--radius-xs); }\n  .ph { background-image: repeating-linear-gradient(135deg, var(--neutral-05) 0 8px, var(--neutral-10) 8px 16px); display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-family: var(--font-mono); font-size: var(--font-size-100); }\n  .cap { font-family: var(--font-mono); font-size: var(--font-size-100); letter-spacing: var(--letter-spacing-wide); text-transform: uppercase; color: var(--text-tertiary); margin-bottom: var(--space-3); }\n  @media (max-width: 960px) { .cols { grid-template-columns: 1fr !important; } .side { display: none; } }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<header style=\"background:var(--surface-card);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:10\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:var(--space-6);padding-top:var(--space-4);padding-bottom:var(--space-4)\">\n    <span style=\"font-size:var(--font-size-500);font-weight:800;letter-spacing:var(--letter-spacing-tight);color:var(--color-primary)\">digirella<\u002Fspan>\n    <span style=\"font-size:var(--font-size-300);color:var(--text-secondary)\">Design system<\u002Fspan>\n    <span style=\"margin-left:auto;font-family:var(--font-mono);font-size:var(--font-size-200);color:var(--text-tertiary)\">v1.0 · primary #006A09<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"wrap cols\" style=\"display:grid;grid-template-columns:210px 1fr;gap:var(--space-10);padding-top:var(--space-9)\">\n  <aside class=\"side\">\n    <nav style=\"position:sticky;top:100px;max-height:calc(100vh - 140px);overflow:auto\">\n      <div class=\"grp\" style=\"margin-top:0\">Foundations<\u002Fdiv>\n      <a href=\"#architecture\">Architecture<\u002Fa>\n      <a href=\"#palette\">Palette<\u002Fa>\n      <a href=\"#color\">Semantic colour<\u002Fa>\n      <a href=\"#type\">Typography<\u002Fa>\n      <a href=\"#space\">Spacing<\u002Fa>\n      <a href=\"#shape\">Shape &amp; border<\u002Fa>\n      <a href=\"#elevation\">Elevation<\u002Fa>\n      <a href=\"#motion\">Motion<\u002Fa>\n      <a href=\"#a11y\">Colour accessibility<\u002Fa>\n      <a href=\"#states\">Interaction states<\u002Fa>\n      <div class=\"grp\">Components<\u002Fdiv>\n      <a href=\"#button\">Button<\u002Fa>\n      <a href=\"usage/button.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Button usage<\u002Fa>\n      <a href=\"#iconbutton\">IconButton<\u002Fa>\n      <a href=\"#card\">Card<\u002Fa>\n      <a href=\"#badge\">Badge &amp; Tag<\u002Fa>\n      <a href=\"#input\">Input<\u002Fa>\n      <a href=\"usage/input.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Input usage<\u002Fa>\n      <a href=\"#select\">Select<\u002Fa>\n      <a href=\"#combobox\">Combobox<\u002Fa>\n      <a href=\"usage/selection-inputs.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Selection usage<\u002Fa>\n      <a href=\"#textarea\">Textarea<\u002Fa>\n      <a href=\"#choice\">Checkbox, Radio, Switch<\u002Fa>\n      <a href=\"usage/choice-controls.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Choice usage<\u002Fa>\n      <a href=\"#slider\">Slider &amp; QuantityStepper<\u002Fa>\n      <a href=\"#tabs\">Tabs<\u002Fa>\n      <a href=\"usage/tabs.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Tabs usage<\u002Fa>\n      <a href=\"#segmented\">SegmentedControl<\u002Fa>\n      <a href=\"#pagination\">Pagination<\u002Fa>\n      <a href=\"#breadcrumb\">Breadcrumb<\u002Fa>\n      <a href=\"#steps\">Steps<\u002Fa>\n      <a href=\"#table\">Table<\u002Fa>\n      <a href=\"usage/table.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Table usage<\u002Fa>\n      <a href=\"#avatar\">Avatar &amp; Rating<\u002Fa>\n      <a href=\"#progress\">ProgressBar &amp; Skeleton<\u002Fa>\n      <a href=\"#accordion\">Accordion<\u002Fa>\n      <a href=\"usage/accordion.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Accordion usage<\u002Fa>\n      <a href=\"#dialog\">Dialog<\u002Fa>\n      <a href=\"usage/modal.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Modal usage<\u002Fa>\n      <a href=\"#drawer\">Drawer<\u002Fa>\n      <a href=\"usage/overlays.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Overlays usage<\u002Fa>\n      <a href=\"#menu\">Menu &amp; Popover<\u002Fa>\n      <a href=\"#alert\">Alert<\u002Fa>\n      <a href=\"#toast\">Toast<\u002Fa>\n      <a href=\"#tooltip\">Tooltip<\u002Fa>\n      <div class=\"grp\">Patterns<\u002Fdiv>\n      <a href=\"#p-pageheader\">Page header<\u002Fa>\n      <a href=\"#p-product\">Product card grid<\u002Fa>\n      <a href=\"#p-filter\">Filter bar<\u002Fa>\n      <a href=\"#p-form\">Form layout<\u002Fa>\n      <a href=\"usage/form-layout.html\" style=\"color:var(--text-brand);font-weight:600\">↳ Form layout usage<\u002Fa>\n      <a href=\"#p-summary\">Order summary<\u002Fa>\n      <a href=\"#p-table\">Data table<\u002Fa>\n      <a href=\"#p-empty\">Empty state<\u002Fa>\n      <a href=\"#p-messaging\">Status messaging<\u002Fa>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <main>\n    <div style=\"padding-bottom:var(--space-8)\">\n      <h1 style=\"font-size:var(--font-size-900);font-weight:700;letter-spacing:var(--letter-spacing-tight);line-height:1.1;margin:0 0 var(--space-5)\">Digirella<\u002Fh1>\n      <p class=\"lead\" style=\"font-size:var(--font-size-400)\">A marketplace design system anchored on a single brand green, <code>#006A09<\u002Fcode>. Three layers: primitive palette, semantic tokens, components. Product code consumes semantic tokens only — never raw palette values — so re-branding is a one-line change. 32 components across six groups, and the composition patterns that put them together.<\u002Fp>\n      <div class=\"box\" style=\"padding:var(--space-5);font-family:var(--font-mono);font-size:var(--font-size-200);color:var(--text-secondary)\">&lt;link rel=\"stylesheet\" href=\"styles.css\"&gt;<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ FOUNDATIONS ============ -->\n    <section id=\"architecture\">\n      <div class=\"cap\">Foundations<\u002Fdiv>\n      <h2>Architecture<\u002Fh2>\n      <p class=\"lead\">Each layer references the one above it. A palette step never appears in a component; a semantic token never hard-codes a hex.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5)\">\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-family:var(--font-mono);font-size:var(--font-size-100);color:var(--text-tertiary)\">01 · PRIMITIVE<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-400);font-weight:600;margin:var(--space-3) 0\">Palette<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.5\">Raw values. <code>--green-60: #006A09<\u002Fcode>. Never used directly in product code.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-family:var(--font-mono);font-size:var(--font-size-100);color:var(--text-tertiary)\">02 · SEMANTIC<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-400);font-weight:600;margin:var(--space-3) 0\">Intent<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.5\">Describes purpose. <code>--color-primary<\u002Fcode>, <code>--text-secondary<\u002Fcode>, <code>--surface-card<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-family:var(--font-mono);font-size:var(--font-size-100);color:var(--text-tertiary)\">03 · COMPONENT<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-400);font-weight:600;margin:var(--space-3) 0\">Usage<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.5\">Button, Input, Card read semantic tokens only. No literal colours.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"palette\">\n      <h2>Palette · primitive<\u002Fh2>\n      <p class=\"lead\"><code>tokens/palette.css<\u002Fcode> · <code>--green-60<\u002Fcode> is the single brand anchor; every other green is a lighter or darker step derived from it.<\u002Fp>\n      <h4 style=\"margin-top:0\">Green<\u002Fh4>\n      <table><thead><tr><th style=\"width:44px\"><\u002Fth><th>Token<\u002Fth><th>Value<\u002Fth><th>Usage<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><span class=\"chip\" style=\"background:var(--green-00)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-00<\u002Ftd><td class=\"val\">#F2F9F3<\u002Ftd><td class=\"use\">Lightest tint — table row highlight<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-05)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-05<\u002Ftd><td class=\"val\">#E4F2E6<\u002Ftd><td class=\"use\">--surface-brand-subtle, success banner<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-10)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-10<\u002Ftd><td class=\"val\">#C7E5CB<\u002Ftd><td class=\"use\">Secondary text on dark green<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-20)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-20<\u002Ftd><td class=\"val\">#9BD1A2<\u002Ftd><td class=\"use\">Green border, overline on dark<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-30)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-30<\u002Ftd><td class=\"val\">#6BBA76<\u002Ftd><td class=\"use\">Brand text on dark surfaces (7.1:1)<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-40)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-40<\u002Ftd><td class=\"val\">#3C9F4A<\u002Ftd><td class=\"use\">Data visualisation<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-50)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-50<\u002Ftd><td class=\"val\">#1A8329<\u002Ftd><td class=\"use\">Data visualisation, second series<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-60)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-60<\u002Ftd><td class=\"val\">#006A09<\u002Ftd><td class=\"use\">BRAND ANCHOR — --color-primary<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-70)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-70<\u002Ftd><td class=\"val\">#005507<\u002Ftd><td class=\"use\">Hover, brand text<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-80)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-80<\u002Ftd><td class=\"val\">#004106<\u002Ftd><td class=\"use\">Pressed<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--green-90)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--green-90<\u002Ftd><td class=\"val\">#002C04<\u002Ftd><td class=\"use\">Dark green surface<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n      <h4>Neutral<\u002Fh4>\n      <table><thead><tr><th style=\"width:44px\"><\u002Fth><th>Token<\u002Fth><th>Value<\u002Fth><th>Usage<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><span class=\"chip\" style=\"background:var(--neutral-00)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--neutral-00<\u002Ftd><td class=\"val\">#FFFFFF<\u002Ftd><td class=\"use\">Card surface<\u002Ftd><\u002Ftr><tr><td><span class=\"chip\" style=\"background:var(--neutral-02)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--neutral-02<\u002Ftd><td class=\"val\">#FAFBFA<\u002Ftd><td class=\"use\">Page background<\u002Ftd><\u002Ftr><tr><td><span class=\"ch \"use\">Overline<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n    <\u002Fsection>\n\n    <section id=\"space\">\n      <h2>Spacing<\u002Fh2>\n      <p class=\"lead\"><code>tokens/spacing.css<\u002Fcode> · 4px base grid. 2px exists only for optical corrections such as icon-to-text alignment.<\u002Fp>\n      <table><thead><tr><th style=\"width:190px\"><\u002Fth><th>Token<\u002Fth><th>Value<\u002Fth><th>Usage<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><span style=\"display:block;height:12px;border-radius:var(--radius-xs);background:var(--color-primary);width:var(--space-1);min-width:2px\"><\u002Fspan><\u002Ftd><td class=\"tok\">--space-1<\u002Ftd><td class=\"val\">2px<\u002Ftd><td class=\"use\">Optical adjustment<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;height:12px;border-radius:var(--radius-xs);background:var(--color-primary);width:var(--space-2);min-width:2px\"><\u002Fspan><\u002Ftd><td class=\"tok\">--space-2<\u002Ftd><td class=\"val\">4px<\u002Ftd><td class=\"use\">Icon-to-text<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;height:12px;border-radius:var(--radius-xs);background:var(--color-primary);width:var(--space-3);min-width:2px\"><\u002Fspan><\u002Ftd><td class=\"tok\">--space-3<\u002Ftd><td class=\"val\">8px<\u002Ftd><td class=\"use\">Tight groups, in-button gap<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;height:12px;border-radius:var(--radius-xs);background:var(--color-primary);width:var(--space-4);min-width:2px\"><\u002Fspan><\u002Ftd><td class=\"tok\">--space-4<\u002Ftd><td class=\"val\">12px<\u002Ftd><td class=\"use\">Between form fields<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;height:12px;border-radius:var(--radius-xs);background:var(--color-primary);width:var(--space-5);min-width:2px\"><\u002Fspan><\u002Ftd><td class=\"tok\">--space-5<\u002Ftd><td class=\"val\">16px<\u002Ftd><td class=\"use\">Dense card padding<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;height:12px;border-radius:var(--radiu \u002Ftr><\u002Ftbody><\u002Ftable>\n      <h4>Border &amp; focus<\u002Fh4>\n      <table><thead><tr><th>Token<\u002Fth><th>Value<\u002Fth><th>Usage<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td class=\"tok\">--border-width-hairline<\u002Ftd><td class=\"val\">1px<\u002Ftd><td class=\"use\">Default border<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--border-width-thick<\u002Ftd><td class=\"val\">2px<\u002Ftd><td class=\"use\">Selected state, active tab<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--focus-ring-width<\u002Ftd><td class=\"val\">2px<\u002Ftd><td class=\"use\">Focus ring thickness<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--focus-ring-offset<\u002Ftd><td class=\"val\">2px<\u002Ftd><td class=\"use\">Gap between ring and element<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--focus-ring<\u002Ftd><td class=\"val\">2px green + 2px offset<\u002Ftd><td class=\"use\">Every focusable element<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n      <div style=\"margin-top:var(--space-6);display:flex;gap:var(--space-6);align-items:center;flex-wrap:wrap\">\n        <button class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary);box-shadow:var(--focus-ring)\">Focused button<\u002Fbutton>\n        <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary);max-width:420px\">The focus ring is always <code>--border-focus<\u002Fcode> green. No component overrides it.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"elevation\">\n      <h2>Elevation<\u002Fh2>\n      <p class=\"lead\"><code>tokens/elevation.css<\u002Fcode> · Shadow is a signal, not decoration. Cards are flat by default; shadow means interaction or layering.<\u002Fp>\n      <table><thead><tr><th style=\"width:190px\"><\u002Fth><th>Token<\u002Fth><th>Usage<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><span style=\"display:block;width:120px;height:44px;background:var(--surface-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--shadow-100<\u002Ftd><td class=\"use\">Sticky header, switch knob<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;width:120px;height:44px;background:var(--surface-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-200)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--shadow-200<\u002Ftd><td class=\"use\">Raised card, summary panel<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;width:120px;height:44px;background:var(--surface-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-300)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--shadow-300<\u002Ftd><td class=\"use\">Hover, popover, toast<\u002Ftd><\u002Ftr><tr><td><span style=\"display:block;width:120px;height:44px;background:var(--surface-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-400)\"><\u002Fspan><\u002Ftd><td class=\"tok\">--shadow-400<\u002Ftd><td class=\"use\">Modal<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n    <\u002Fsection>\n\n    <section id=\"motion\">\n      <h2>Motion<\u002Fh2>\n      <p class=\"lead\"><code>tokens/motion.css<\u002Fcode> · Short and functional. One default curve. No bounce, spring, or rotation; no page-transition animation.<\u002Fp>\n      <table><thead><tr><th>Token<\u002Fth><th>Value<\u002Fth><th>Usage<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td class=\"tok\">--duration-instant<\u002Ftd><td class=\"val\">80ms<\u002Ftd><td class=\"use\">Immediate feedback<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--duration-fast<\u002Ftd><td class=\"val\">140ms<\u002Ftd><td class=\"use\">Hover, focus, colour change<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--duration-normal<\u002Ftd><td class=\"val\">220ms<\u002Ftd><td class=\"use\">Dropdown, popover, shadow<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--duration-slow<\u002Ftd><td class=\"val\">360ms<\u002Ftd><td class=\"use\">Modal enter / exit<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--ease-standard<\u002Ftd><td class=\"val\">cubic-bezier(.2,0,0,1)<\u002Ftd><td class=\"use\">Default<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--ease-entrance<\u002Ftd><td class=\"val\">cubic-bezier(0,0,0,1)<\u002Ftd><td class=\"use\">Entering elements<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--ease-exit<\u002Ftd><td class=\"val\">cubic-bezier(.3,0,1,1)<\u002Ftd><td class=\"use\">Exiting elements<\u002Ftd><\u002Ftr><tr><td class=\"tok\">--transition-interactive<\u002Ftd><td class=\"val\">fast · standard<\u002Ftd><td class=\"use\">Button / input state changes<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable>\n    <\u002Fsection>\n\n\n    <section id=\"a11y\">\n      <h2>Colour accessibility<\u002Fh2>\n      <p class=\"lead\">Every colour pair the system actually renders was measured against WCAG 2.2. Text pairs are held to 4.5:1 (AA) and non-text UI boundaries to 3:1 (1.4.11). Nothing in the tables below is aspirational — these are computed ratios for the shipping token values.<\u002Fp>\n\n      <h4 style=\"margin-top:0\">Text — minimum 4.5:1<\u002Fh4>\n      <table>\n        <thead><tr><th>Foreground<\u002Fth><th>Background<\u002Fth><th style=\"width:90px\">Ratio<\u002Fth><th style=\"width:90px\">Level<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"tok\">--text-primary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">17.7:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-primary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-page<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">17.1:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-secondary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">6.5:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-tertiary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">4.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-tertiary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-sunken<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">4.6:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-brand<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">9.1:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-brand<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-brand-subtle<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">7.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-link<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">7.1:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-success<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-brand-subtle<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">7.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-warning<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">5.8:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-danger<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">8.4:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--color-on-primary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --color-primary<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">6.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA*<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--text-inverse<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-inverse<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">17.7:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--green-30<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">on --surface-inverse<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">7.5:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">AAA<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"lead\" style=\"margin-top:var(--space-4)\">* White on <code>#006A09<\u002Fcode> reaches 6.9:1 — AAA for large text, AA for body. It is the tightest pair in the system, and the reason the brand green is this dark: a lighter green could not carry white text at all.<\u002Fp>\n\n      <h4>Non-text UI — minimum 3:1<\u002Fh4>\n      <table>\n        <thead><tr><th>Element<\u002Fth><th>Against<\u002Fth><th style=\"width:90px\">Ratio<\u002Fth><th style=\"width:90px\">1.4.11<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"tok\">--border-focus<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">6.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--border-focus<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-page<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">6.6:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--color-primary<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">6.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--border-control<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">3.1:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--border-strong<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">3.1:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--status-danger<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">6.1:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--status-info<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">5.0:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--status-warning<\u002Ftd><td class=\"tok\" style=\"color:var(--text-tertiary)\">vs --surface-card<\u002Ftd><td class=\"tok\" style=\"font-weight:600\">3.9:1<\u002Ftd><td><span style=\"font-family:var(--font-mono);font-size:var(--font-size-100);font-weight:600;padding:3px 8px;border-radius:var(--radius-xs);background:var(--surface-brand-subtle);color:var(--text-success)\">pass<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <h4>Deliberate exemptions<\u002Fh4>\n      <table>\n        <thead><tr><th style=\"width:220px\">Token<\u002Fth><th style=\"width:90px\">Ratio<\u002Fth><th>Why it is exempt<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"tok\">--text-disabled<\u002Ftd><td class=\"tok\">2.6:1<\u002Ftd><td class=\"use\">WCAG 1.4.3 exempts inactive controls. Disabled state is never the only signal — the control also loses its fill and takes <code>cursor: not-allowed<\u002Fcode>.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--border-subtle<\u002Ftd><td class=\"tok\">1.3:1<\u002Ftd><td class=\"use\">Decorative only: card edges and dividers. No control is identified by it, so 1.4.11 does not apply. Anything that <em>does<\u002Fem> bound a control uses <code>--border-control<\u002Fcode> instead.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">--border-default<\u002Ftd><td class=\"tok\">1.3:1<\u002Ftd><td class=\"use\">Same — table rules and card separators. Form fields never use it.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <h4>Beyond contrast<\u002Fh4>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)\">\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-size:var(--font-size-300);font-weight:600;margin-bottom:var(--space-3)\">Colour is never the only signal<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.55\">Every status pairs a colour with a glyph and a word: Alert carries ✓ / i / ! / ×, Badge carries its label, field errors carry text. A red-green colour-blind user loses nothing.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-size:var(--font-size-300);font-weight:600;margin-bottom:var(--space-3)\">Focus is always visible<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.55\">One ring token on every focusable element at 6.9:1, including destructive buttons. No component removes the outline without replacing it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-size:var(--font-size-300);font-weight:600;margin-bottom:var(--space-3)\">Hit targets<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.55\">Controls are 38px minimum with the label inside the target, clearing the 24px of WCAG 2.5.8. Mobile layouts raise this to 44px.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"box\" style=\"padding:var(--space-6)\">\n          <div style=\"font-size:var(--font-size-300);font-weight:600;margin-bottom:var(--space-3)\">Not yet verified<\u002Fdiv>\n          <div style=\"font-size:var(--font-size-200);color:var(--text-secondary);line-height:1.55\">Screen-reader labelling and keyboard traps need testing in a real build — static contrast maths cannot cover them. Dark theme tokens do not exist yet and will need their own audit.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"states\">\n      <h2>Interaction states<\u002Fh2>\n      <p class=\"lead\">Five rules cover the whole system; a component that needs a sixth is doing too much. Every component section below carries its own state matrix, rendered side by side so states can be compared without hovering.<\u002Fp>\n      <table>\n        <thead><tr><th style=\"width:110px\">State<\u002Fth><th style=\"width:300px\">Rule<\u002Fth><th>Tokens<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"tok\">hover<\u002Ftd><td class=\"use\">One step darker, or a neutral fill on transparent controls. Never an opacity change.<\u002Ftd><td class=\"toks\">--color-primary-hover · --surface-hover<\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">active<\u002Ftd><td class=\"use\">One step darker again. No scale, no translate — pressing must not move the target.<\u002Ftd><td class=\"toks\">--color-primary-active · --surface-active<\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">focus<\u002Ftd><td class=\"use\">2px green ring at 2px offset, identical on every focusable element including destructive ones. Fields use a 3px tinted halo instead, because a ring around a 38px box reads as an error.<\u002Ftd><td class=\"toks\">--focus-ring · --border-focus<\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">selected<\u002Ftd><td class=\"use\">Filled with primary green where the control <em>is<\u002Fem> the choice (Tag, Pagination); tinted green where the row merely holds it (table row, option).<\u002Ftd><td class=\"toks\">--color-primary · --surface-brand-subtle<\u002Ftd><\u002Ftr>\n          <tr><td class=\"tok\">disabled<\u002Ftd><td class=\"use\">Neutral fill, <code>--text-disabled<\u002Fcode>, <code>cursor: not-allowed<\u002Fcode>. Colour is dropped entirely — a faded green still reads as available.<\u002Ftd><td class=\"toks\">--surface-disabled · --text-disabled<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"lead\" style=\"margin-top:var(--space-6)\">Timing is <code>--duration-fast<\u002Fcode> on <code>--ease-standard<\u002Fcode> for all five. Focus is the exception: it appears instantly, because a delayed focus ring feels broken to keyboard users.<\u002Fp>\n      <div class=\"mx\" style=\"grid-template-columns:150px repeat(5,1fr)\">\n  <span><\u002Fspan><span class=\"ch\">Default<\u002Fspan><span class=\"ch\">Hover<\u002Fspan><span class=\"ch\">Active<\u002Fspan><span class=\"ch\">Focus<\u002Fspan><span class=\"ch\">Disabled<\u002Fspan>\n  <span class=\"rh\">Link<\u002Fspan><span class=\"cell\"><a href=\"#states\" style=\"color:var(--text-link);text-decoration:none\">Seller profile<\u002Fa><\u002Fspan><span class=\"cell\"><a href=\"#states\" style=\"color:var(--text-link-hover);text-decoration:underline\">Seller profile<\u002Fa><\u002Fspan><span class=\"cell\"><a href=\"#states\" style=\"color:var(--blue-70);text-decoration:underline\">Seller profile<\u002Fa><\u002Fspan><span class=\"cell\"><a href=\"#states\" style=\"color:var(--text-link);text-decoration:none;border-radius:var(--radius-xs);box-shadow:var(--focus-ring)\">Seller profile<\u002Fa><\u002Fspan><span class=\"cell\"><span style=\"color:var(--text-disabled)\">Seller profile<\u002Fspan><\u002Fspan>\n<\u002Fdiv><p class=\"lead\" style=\"margin:var(--space-5) 0 0\">Links underline on hover, not at rest — inline links in body copy stay readable, and the underline confirms the target when the pointer arrives. Text selection is tinted <code>--green-10<\u002Fcode> via <code>::selection<\u002Fcode>, so selecting a price never turns it blue.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- ============ COMPONENTS ============ -->\n    <section id=\"button\">\n      <div class=\"cap\">Components<\u002Fdiv>\n      <h2>Button<\u002Fh2>\n      <p class=\"lead\">The primary action control. One <code>primary<\u002Fcode> button per view; everything else is secondary or lower.<\u002Fp>\n      <div class=\"spec\">\n        <span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary);border-radius:var(--radius-control)\">Primary<\u002Fspan>\n        <span class=\"btn\" style=\"background:var(--surface-card);color:var(--text-primary);border-color:var(--border-strong);border-radius:var(--radius-control)\">Secondary<\u002Fspan>\n        <span class=\"btn\" style=\"background:var(--surface-brand-subtle);color:var(--text-brand);border-radius:var(--radius-control)\">Subtle<\u002Fspan>\n        <span class=\"btn\" style=\"color:var(--text-primary);border-radius:var(--radius-control)\">Ghost<\u002Fspan>\n        <span class=\"btn\" style=\"background:var(--status-danger);color:var(--text-inverse);border-radius:var(--radius-control)\">Danger<\u002Fspan>\n        <span class=\"btn\" style=\"background:var(--surface-disabled);color:var(--text-disabled);border-radius:var(--radius-control)\">Disabled<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"spec\" style=\"margin-top:var(--space-4)\">\n        <span class=\"btn\" style=\"background:var(--color-primary);color:var(--color-on-primary);padding:6px 14px;font-size:var(--font-size-200);border-radius:var(--radius-control)\">Small · 30px<\u002Fspan>\n        <span class=\"btn\" style=\"background:var(--co oke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300);background:var(--surface-card);border:1px solid var(--border-strong);width:100%;justify-content:space-between;gap:var(--space-4)\">Standard <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"color:var(--text-secondary);flex:0 0 16px;\"><path d=\"M4 6.5L8 10.5L12 6.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300);background:var(--surface-card);border:1px solid var(--border-focus);box-shadow:0 0 0 3px var(--green-05);width:100%;justify-content:space-between;gap:var(--space-4)\">Standard <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"color:var(--text-secondary);flex:0 0 16px;transform:rotate(180deg)\"><path d=\"M4 6.5L8 10.5L12 6.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300);background:var(--surface-card);border:1px solid var(--border-default);width:100%;justify-content:space-between;gap:var(--space-4)\">Express <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"color:var(--text-secondary);flex:0 0 16px;\"><path d=\"M4 6.5L8 10.5L12 6.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300);background:var(--surface-card);border:1px solid var(--border-danger);color:var(--text-tertiary);width:100%;justify-content:space-between;gap:var(--space-4)\">Choose one <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"color:var(--text-secondary);flex:0 0 16px;\"><path d=\"M4 6.5L8 10.5L12 6.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300);background:var(--surface-card);border:1px solid var(--border-subtle);background:var(--surface-disabled);color:var(--text-disabled);width:100%;justify-content:space-between;gap:var(--space-4)\">Standard <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" style=\"color:var(--text-secondary);flex:0 0 16px;\"><path d=\"M4 6.5L8 10.5L12 6.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n      <div class=\"api\">label, hint, error, options: { value, label }[] &nbsp;·&nbsp; min-height 38px · 16px chevron<\u002Fdiv>\n    <\u002Fsection>\n\n\n    <section id=\"combobox\">\n      <h2>Combobox<\u002Fh2>\n      <p class=\"lead\">Type-ahead single select. Use it above roughly ten options, where scrolling a plain Select becomes a chore — categories, cities, brands. ↑/↓ move the highlight, Enter picks, Esc closes.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:340px 1fr;gap:var(--space-7);align-items:start\">\n        <div style=\"position:relative\">\n          <div style=\"font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)\">Category<\u002Fdiv>\n          <div style=\"border:1px solid var(--border-focus);box-shadow:0 0 0 3px var(--green-05);border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;font-size:var(--font-size-300);background:var(--surface-card);display:flex;justify-content:space-between;align-items:center;gap:var(--space-4)\">head<span style=\"width:1px;height:16px;background:var(--text-primary)\"><\u002Fspan><span style=\"margin-left:auto;transform:rotate(180deg);display:inline-flex\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\" style=\"color:var(--text-secondary);flex:0 0 16px\"><path d=\"M4 6.5L8 10.5L12 6.5\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:4px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-300);padding:var(--space-2)\">\n            <div style=\"display:flex;justify-content:space-between;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300);background:var(--surface-hover)\">Headphones <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">1 284<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300)\">Headsets &amp; mics <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">312<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:9px var(--space-4);border-radius:var(--radius-xs);font-size:var(--font-size-300)\">Headboards <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">88<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding-top:var(--space-8)\">\n          <div class=\"rule\"><b>Highlight<\u002Fb><span><code>--surface-hover<\u002Fcode> only. The active row is never green — green is reserved for the chosen value's check mark.<\u002Fspan><\u002Fdiv>\n          <div class=\"rule\"><b>Meta<\u002Fb><span>The right-aligned figure is optional; use it for result counts, never for prices.<\u002Fspan><\u002Fdiv>\n          <div class=\"rule\"><b>Empty<\u002Fb><span>Show “No matches” inside the list, not as an error below the field.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">options: { value, label, meta? }[], value, onChange, placeholder, emptyText<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\">Combobox is one of six selection controls. <a href=\"usage/selection-inputs.html\"><b>Selection inputs — full usage guidance<\u002Fb><\u002Fa> covers the decision table, anatomy, all six variants (including MultiSelect and TreeSelect), open/filter/keyboard behaviour, loading and empty states, do/don't pairs, content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"textarea\">\n      <h2>Textarea<\u002Fh2>\n      <p class=\"lead\">Multi-line input, vertically resizable only. When the backend limits length, set <code>maxLength<\u002Fcode> — the live counter is the only warning users get before truncation.<\u002Fp>\n      <div style=\"max-width:440px\">\n        <div style=\"font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)\">Description<\u002Fdiv>\n        <div style=\"border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);font-size:var(--font-size-300);line-height:1.5;background:var(--surface-card);min-height:88px;color:var(--text-secondary)\">Boxed, with all accessories. No cosmetic damage; battery health 98%.<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-2)\">\n          <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">Describe condition and what's included<\u002Fspan>\n          <span style=\"font-size:var(--font-size-200);color:var(--text-tertiary);font-family:var(--font-mono)\">64/500<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"api\">label, hint, error, rows (default 4), maxLength<\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"choice\">\n      <h2>Checkbox, Radio, Switch<\u002Fh2>\n      <p class=\"lead\">Checkbox for independent options in a form that is saved. Radio for one of two to five. Switch only when the change applies immediately, with no save button.<\u002Fp>\n      <div class=\"spec\" style=\"gap:var(--space-9)\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n          <label style=\"display:flex;gap:var(--space-4);align-items:flex-start;font-size:var(--font-size-300)\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan>Promotional email<\u002Flabel>\n          <label style=\"display:flex;gap:var(--space-4);align-items:flex-start;font-size:var(--font-size-300);color:var(--text-secondary)\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-strong);background:var(--surface-card)\"><\u002Fspan>SMS alerts<\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n          <label style=\"display:flex;gap:var(--space-4);align-items:flex-start;font-size:var(--font-size-300)\"><span style=\"width:20px;height:20px;border-radius:50%;border:6px solid var(--color-primary);background:var(--surface-card)\"><\u002Fspan><span>Express<br><span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">Next day<\u002Fspan><\u002Fspan><\u002Flabel>\n          <label style=\"display:flex;gap:var(--space-4);align-items:flex-start;font-size:var(--font-size-300);color:var(--text-secondary)\"><span style=\"width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-card)\"><\u002Fspan><span>Standard<br><span style=\"font-size:var(--font-size-200);color:var(--text-tertiary)\">2–4 days<\u002Fspan><\u002Fspan><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n          <label style=\"display:flex;align-items:center;gap:var(--space-4);font-size:var(--font-size-300)\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);background:var(--color-primary);padding:3px;display:flex;justify-content:flex-end\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan>Vacation mode<\u002Flabel>\n          <label style=\"display:flex;align-items:center;gap:var(--space-4);font-size:var(--font-size-300);color:var(--text-secondary)\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);background:var(--neutral-30);padding:3px;display:flex\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan>Auto-relist<\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mx\" style=\"grid-template-columns:150px repeat(5,1fr)\">\n  <span><\u002Fspan><span class=\"ch\">Unchecked<\u002Fspan><span class=\"ch\">Unchecked hover<\u002Fspan><span class=\"ch\">Checked<\u002Fspan><span class=\"ch\">Focus<\u002Fspan><span class=\"ch\">Disabled<\u002Fspan>\n  <span class=\"rh\">Checkbox<\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;border:1px solid var(--border-strong);background:var(--surface-card)\"><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;border:1px solid var(--text-secondary);background:var(--surface-hover)\"><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:var(--color-primary);border:1px solid var(--color-primary)\">✓<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:var(--color-primary);border:1px solid var(--color-primary);box-shadow:var(--focus-ring)\">✓<\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:var(--radius-xs);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;border:1px solid var(--border-default);background:var(--surface-disabled)\"><\u002Fspan><\u002Fspan>\n  <span class=\"rh\">Radio<\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:50%;display:inline-block;border:1px solid var(--border-strong);background:var(--surface-card)\"><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:50%;display:inline-block;border:1px solid var(--text-secondary);background:var(--surface-hover)\"><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:50%;display:inline-block;border:6px solid var(--color-primary);background:var(--surface-card)\"><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:50%;display:inline-block;border:6px solid var(--color-primary);background:var(--surface-card);box-shadow:var(--focus-ring)\"><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:20px;height:20px;border-radius:50%;display:inline-block;border:1px solid var(--border-default);background:var(--surface-disabled)\"><\u002Fspan><\u002Fspan>\n  <span class=\"rh\">Switch<\u002Fspan><span class=\"cell\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);padding:3px;display:inline-flex;justify-content:flex-start;background:var(--neutral-30);\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);padding:3px;display:inline-flex;justify-content:flex-start;background:var(--neutral-30);background:var(--neutral-40)\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);padding:3px;display:inline-flex;justify-content:flex-end;background:var(--color-primary);\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);padding:3px;display:inline-flex;justify-content:flex-end;background:var(--color-primary);box-shadow:var(--focus-ring)\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan><\u002Fspan><span class=\"cell\"><span style=\"opacity:.5\"><span style=\"width:44px;height:26px;border-radius:var(--radius-pill);padding:3px;display:inline-flex;justify-content:flex-start;background:var(--neutral-30);\"><span style=\"width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)\"><\u002Fspan><\u002Fspan><\u002Fspan><\u002Fspan>\n<\u002Fdiv><p class=\"lead\" style=\"margin:var(--space-5) 0 0\">Hover darkens the <em>border<\u002Fem>, not the fill — a 20px box is too small for a fill change to read as anything but an error. The label is part of the hit area at all times.<\u002Fp>\n      <div class=\"api\">All three: label, description, checked, disabled &nbsp;·&nbsp; 20px control, 44px total hit target<\u002Fdiv>\n      <p class=\"lead\" style=\"margin-top:var(--space-5)\"><a href=\"usage/choice-controls.html\"><b>Choice controls — full usage guidance<\u002Fb><\u002Fa>: choosing between the three, indeterminate state, group layout and labelling, validation, async failure on switches, content rules and accessibility.<\u002Fp>\n    <\u002Fsection>\n\n\n    <section id=\"slider\">\n      <h2>Slider &amp; QuantityStepper<\u002Fh2>\n      <p class=\"lead\">Slider for a value whose relative position matters more than the exact number; always paired with a live readout. QuantityStepper for small integers — it caps at stock and disables the button rather than clamping silently.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8);align-items:center;max-width:760px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-3)\">\n            <span style=\"font-size:var(--font-size-300);font-weight:500\">Max price<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:var(--font-size-200);color:var(--text-secondary)\">6 500 ₺<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:20px;display:flex;align-items:center\">\n            <div style=\"position:absolute;left:0;right:0;height:4px;border-radius:var(--radius-pill);background:var(--neutral-20)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;width:65%;height:4px;border-radius:var(--radius-pill);background:var(--color-primary)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:calc(65% - 9px);width:18px;height:18px;border-radius:50%;background:var(--surface-card);border:2px solid var(--color-primary);box-shadow:var(--shadow-100)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\
