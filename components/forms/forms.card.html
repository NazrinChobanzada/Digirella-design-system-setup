<!-- @dsCard group="Components" viewport="700x340" name="Forms" subtitle="Input, Select, Checkbox, Radio, Switch" -->
<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><title>Forms</title>
<link href="../../styles.css" rel="stylesheet"/>
<style>
  body{background:var(--surface-card);padding:var(--space-6);margin:0}
  .row{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:var(--space-5)}
  .lbl{font:var(--font-weight-semibold) var(--font-size-100)/1.4 var(--font-mono);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-3);font-family:var(--font-sans);font-weight:var(--font-weight-semibold);line-height:1;border-radius:var(--radius-control);border:1px solid transparent;cursor:pointer;padding:10px 20px;font-size:var(--font-size-300)}
</style>
</head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);font-family:var(--font-sans)">
<div class="stack" style="gap:var(--space-4)">
<div>
<div style="font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)">Email</div>
<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;color:var(--text-tertiary);font-size:var(--font-size-300)">ad@ornek.com</div>
<div style="font-size:var(--font-size-200);color:var(--text-tertiary);margin-top:var(--space-2)">Order notifications go here</div>
</div>
<div>
<div style="font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)">Focused</div>
<div style="border:1px solid var(--border-focus);box-shadow:0 0 0 3px var(--green-05);border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300)">Wireless headphones</div>
</div>
<div>
<div style="font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)">Error</div>
<div style="border:1px solid var(--border-danger);border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;display:flex;align-items:center;font-size:var(--font-size-300)">1234</div>
<div style="font-size:var(--font-size-200);color:var(--text-danger);margin-top:var(--space-2)">Enter a valid postcode</div>
</div>
</div>
<div class="stack" style="gap:var(--space-5)">
<div>
<div style="font-size:var(--font-size-300);font-weight:500;margin-bottom:var(--space-2)">Shipping</div>
<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px var(--space-4);min-height:38px;font-size:var(--font-size-300);display:flex;justify-content:space-between;align-items:center;gap:var(--space-4)">Standard <svg fill="none" height="16" style="color:var(--text-secondary);flex:0 0 16px" viewbox="0 0 16 16" width="16"><path d="M4 6.5L8 10.5L12 6.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg></div>
</div>
<div style="display:flex;align-items:flex-start;gap:var(--space-4)">
<span style="width:20px;height:20px;border-radius:var(--radius-xs);background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px">✓</span>
<span style="font-size:var(--font-size-300)">Promotional emails</span>
</div>
<div style="display:flex;align-items:flex-start;gap:var(--space-4)">
<span style="width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--border-strong)"></span>
<span style="font-size:var(--font-size-300);color:var(--text-secondary)">SMS bildirimleri</span>
</div>
<div style="display:flex;align-items:flex-start;gap:var(--space-4)">
<span style="width:20px;height:20px;border-radius:50%;border:6px solid var(--color-primary);background:#fff"></span>
<span style="font-size:var(--font-size-300)">Fast delivery <span style="color:var(--text-tertiary)">· tomorrow</span></span>
</div>
<div style="display:flex;align-items:center;gap:var(--space-4)">
<span style="width:44px;height:26px;border-radius:var(--radius-pill);background:var(--color-primary);padding:3px;display:flex;justify-content:flex-end"><span style="width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-100)"></span></span>
<span style="font-size:var(--font-size-300)">Seller holiday mode</span>
</div>
</div>
</div>
</body></html>
